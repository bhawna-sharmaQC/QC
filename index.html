<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team Allocation & Timesheet Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F4F2;--surface:#fff;--surface2:#F6F8F7;--line:#DBE2DE;--line2:#EAEEEC;--ink:#14201B;--ink2:#46554E;--ink3:#76847D;--nav:#0F2F27;--nav2:#1B4A3E;--navink:#CFE3DA;--navdim:#7FA394;--brand:#17705A;--brandink:#fff;--mint:#DDF0E6;--mintink:#0E5744;--amber:#A96A0C;--amberbg:#FBEFD6;--red:#B3261E;--redbg:#FBE4E1;--blue:#2F5F9E;--bluebg:#E2ECF8;--fa:#17705A;--cs:#3C6EB4;--int:#C88A1E;--grid:#E4E9E6;--hatch:#9BC9B8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1512;--surface:#141D19;--surface2:#19241F;--line:#2A3933;--line2:#212E29;--ink:#E5EEE9;--ink2:#AEC0B7;--ink3:#7D9088;--nav:#0A1813;--nav2:#173A31;--navink:#B8CEC4;--navdim:#6F8E80;--brand:#3DBF9A;--brandink:#06251C;--mint:#173A2F;--mintink:#8FE0C3;--amber:#E0A94A;--amberbg:#3A2E14;--red:#F0837B;--redbg:#3D1C19;--blue:#7FAAE3;--bluebg:#1C2D45;--fa:#3DBF9A;--cs:#7FAAE3;--int:#E0A94A;--grid:#25332D;--hatch:#2C6553;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1512;--surface:#141D19;--surface2:#19241F;--line:#2A3933;--line2:#212E29;--ink:#E5EEE9;--ink2:#AEC0B7;--ink3:#7D9088;--nav:#0A1813;--nav2:#173A31;--navink:#B8CEC4;--navdim:#6F8E80;--brand:#3DBF9A;--brandink:#06251C;--mint:#173A2F;--mintink:#8FE0C3;--amber:#E0A94A;--amberbg:#3A2E14;--red:#F0837B;--redbg:#3D1C19;--blue:#7FAAE3;--bluebg:#1C2D45;--fa:#3DBF9A;--cs:#7FAAE3;--int:#E0A94A;--grid:#25332D;--hatch:#2C6553;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}
.nav{background:var(--nav);color:var(--navink);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;padding:14px 10px 28px;display:flex;flex-direction:column;gap:1px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 12px;color:#fff;font-weight:600;line-height:1.2}
.brand i{flex:none;width:30px;height:30px;border-radius:7px;background:var(--brand);color:var(--brandink);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px}
.brand small{display:block;font-weight:400;color:var(--navdim);font-size:11.5px}
.nav h6{margin:14px 10px 4px;font-size:11.5px;font-weight:600;color:var(--navdim)}
.nav a{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:7px;color:var(--navink);text-decoration:none;cursor:pointer;font-weight:500;font-size:13.5px}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:var(--nav2);color:#fff}
.nav a .ct{margin-left:auto;background:var(--red);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;line-height:17px}
.main{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;padding:10px 24px}
.top h1{font-size:17px}
.top .sp{flex:1}
.top .who{font-size:12.5px;color:var(--ink2);text-align:right;line-height:1.25}
.hb{display:none}
.filters{display:flex;flex-wrap:wrap;gap:8px 10px;padding:10px 24px;background:var(--surface2);border-bottom:1px solid var(--line);align-items:flex-end}
.f{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--ink3)}
.f select,.f input,.fg input,.fg select,.fg textarea,.inl{height:32px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 8px;font-size:13px;min-width:0}
.f select{max-width:170px}
.page{padding:20px 24px 70px;max-width:1560px}
.ph{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;margin-bottom:14px}
.ph h2{font-size:20px}
.ph p{margin:2px 0 0;color:var(--ink2);font-size:13px}
.ph .sp{flex:1}
.btn{height:32px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.p{background:var(--brand);color:var(--brandink);border-color:var(--brand)}
.btn.p:hover{filter:brightness(1.07)}
.btn.d{color:var(--red)}
.btn.s{height:26px;padding:0 8px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 1px rgba(16,32,26,.04)}
.card h3{font-size:14.5px;margin-bottom:2px}
.card .sub{color:var(--ink3);font-size:12.5px;margin-bottom:10px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}
.g2>.card{margin-bottom:0}
.gap{margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 13px;border-left:3px solid var(--line)}
.kpi.g{border-left-color:var(--brand)}.kpi.a{border-left-color:var(--amber)}.kpi.r{border-left-color:var(--red)}
.kpi .l{font-size:12px;color:var(--ink2)}
.kpi .v{font-size:22px;font-weight:600;margin-top:1px;letter-spacing:-.01em}
.kpi .v small{font-size:12px;font-weight:500;color:var(--ink3);margin-left:3px}
.kpi .s{font-size:11.5px;color:var(--ink3);margin-top:1px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.card .tw{border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--mint);color:var(--mintink);font-weight:600;text-align:left;padding:7px 10px;white-space:nowrap;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}
td{padding:6px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:middle}
tbody tr:hover td{background:var(--surface2)}
td.n,th.n{text-align:right}
tfoot td{font-weight:600;background:var(--surface2);border-top:2px solid var(--line);border-bottom:0}
tr.grp td{background:var(--surface2);font-weight:600;color:var(--ink2);font-size:12.5px}
tr.hl td{background:var(--amberbg)}
td.wrap{white-space:normal;min-width:180px}
.pos{color:var(--brand)}.neg{color:var(--red)}.mut{color:var(--ink3)}
.avail{background:var(--mint);color:var(--mintink);font-weight:600}
.b{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:500;background:var(--line2);color:var(--ink2);white-space:nowrap}
.b.g{background:var(--mint);color:var(--mintink)}.b.a{background:var(--amberbg);color:var(--amber)}.b.r{background:var(--redbg);color:var(--red)}.b.b{background:var(--bluebg);color:var(--blue)}
.pb{height:6px;min-width:70px;background:var(--line2);border-radius:3px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--brand)}.pb.a i{background:var(--amber)}.pb.r i{background:var(--red)}
.empty{padding:26px;text-align:center;color:var(--ink3);border:1px dashed var(--line);border-radius:8px;background:var(--surface)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs a{padding:8px 14px;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent;font-weight:500;white-space:nowrap}
.tabs a.on{color:var(--brand);border-bottom-color:var(--brand)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.fg label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink2)}
.fg textarea{height:auto;padding:6px 8px;min-height:64px}
.fg label.chk{flex-direction:row;align-items:center;gap:8px;height:32px}
.fg input[type=checkbox]{height:auto;width:16px}
.inl{height:28px;width:84px}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2);margin-bottom:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink3);font-size:10px;font-family:inherit}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.runway{position:relative;height:34px;background:var(--line2);border-radius:5px;margin:30px 0 26px}
.runway .ach{position:absolute;left:0;top:0;bottom:0;background:var(--brand);border-radius:5px 0 0 5px}
.runway .prj{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--hatch) 0 5px,transparent 5px 10px);border:1px dashed var(--brand)}
.runway .mk{position:absolute;top:-8px;bottom:-8px;width:2px;background:var(--ink)}
.runway .mk span,.runway .pt span{position:absolute;white-space:nowrap;font-size:11.5px;color:var(--ink2)}
.runway .mk span{top:-18px;left:50%;transform:translateX(-50%)}
.runway .pt{position:absolute;top:0;bottom:0;width:0}
.runway .pt span{bottom:-20px;left:0;transform:translateX(-50%)}
.hero{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline}
.hero strong{font-size:15px}
.mb{position:fixed;inset:0;background:rgba(8,18,14,.55);display:grid;place-items:center;z-index:100;padding:16px}
.m{background:var(--surface);border-radius:10px;width:min(640px,100%);max-height:92vh;overflow:auto;padding:18px 20px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.m.w{width:min(860px,100%)}
.m h3{font-size:16px;margin-bottom:10px}
.m .ft{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.err{color:var(--red);font-size:12.5px;margin-top:8px;min-height:16px}
.note{font-size:12.5px;color:var(--ink2);background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:12px}
.note.a{background:var(--amberbg);border-color:transparent;color:var(--amber)}
.note.r{background:var(--redbg);border-color:transparent;color:var(--red)}
.note.g{background:var(--mint);border-color:transparent;color:var(--mintink)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:90vw}
#toast div.e{background:var(--red);color:#fff}
.boot{display:grid;place-items:center;min-height:60vh;color:var(--ink3)}
.prev{border:1px solid var(--line);border-radius:6px;padding:14px;background:#fff;color:#1a1a1a;font-family:Arial,sans-serif;font-size:13px;overflow:auto;max-height:52vh}
.prev table{font-size:12px}.prev th{background:#e8f3ed;color:#0e5744;position:static}.prev td{color:#1a1a1a;background:#fff!important}
.sec{display:flex;align-items:center;gap:10px;margin:18px 0 8px}.sec h3{font-size:15px}
.tag{font-size:11.5px;color:var(--ink3)}
.bar-h{display:flex;align-items:center;gap:8px}
@media (max-width:960px){
.app{grid-template-columns:minmax(0,1fr)}
.nav{position:fixed;left:-260px;width:250px;z-index:60;transition:left .18s;top:0;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.nav.open{left:0;box-shadow:0 0 40px rgba(0,0,0,.4)}
.hb{display:inline-flex}
.top,.filters,.page{padding-left:14px;padding-right:14px}
.g2{grid-template-columns:minmax(0,1fr)}
.top .who{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="boot">Loading portal…</div></div>
<div id="modal"></div>
<div id="toast"></div>
<!--
  ============================================================================
  SELF-HOSTED SETUP (only needed if you are NOT opening this inside Claude)
  1. Create a free project at https://console.firebase.google.com
  2. Build > Firestore Database > Create database (start in "production mode")
  3. Build > Authentication > Sign-in method > enable "Anonymous"
  4. Project settings (gear icon) > General > scroll to "Your apps" > Web app
     (</>) > register an app > copy the firebaseConfig object it gives you
  5. Paste those values into FIREBASE_CONFIG below, replacing the empty strings
  6. Put your own email(s) in ADMIN_EMAILS below
  7. In Firestore Database > Rules, paste:
       rules_version = '2';
       service cloud.firestore {
         match /databases/{database}/documents {
           match /{document=**} { allow read, write: if request.auth != null; }
         }
       }
  8. Upload this file (as index.html) to GitHub Pages / any static host.
  Without steps 1-7, this file still runs, but only as a single-browser demo —
  nothing will sync between teammates.
  ============================================================================
-->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script>
(()=>{
'use strict';
const FIREBASE_CONFIG={apiKey:"",authDomain:"",projectId:"",storageBucket:"",messagingSenderId:"",appId:""}; /* paste your Firebase config here */
const ADMIN_EMAILS=[]; /* e.g. ['you@yourcompany.com'] — these people get full Admin rights */
const SITE_PASSWORD=""; /* set any password here (e.g. "acme2026") to lock the whole portal behind it. Leave "" to disable. Anyone who views this file's source can see this password — it blocks casual visitors, not a determined attacker. */
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const lc=s=>String(s||'').trim().toLowerCase();
const sum=(a,f)=>{let t=0;for(const x of a)t+=+(f?f(x):x)||0;return t};
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const monthOf=s=>s.slice(0,7);
const dim=m=>{const p=m.split('-').map(Number);return new Date(p[0],p[1],0).getDate()};
const mEnd=m=>m+'-'+pad(dim(m));
const addMonths=(m,n)=>{const p=m.split('-').map(Number);const d=new Date(p[0],p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const prevMonth=m=>addMonths(m,-1);
const dow=s=>pd(s).getDay();
const fD=s=>pd(s).toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'});
const fDL=s=>pd(s).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fM=m=>pd(m+'-01').toLocaleDateString('en-US',{month:'long',year:'numeric'});
const fMs=m=>pd(m+'-01').toLocaleDateString('en-US',{month:'short',year:'2-digit'});
const nf=(v,d=1)=>v==null||!isFinite(v)?'–':(+v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const n0=v=>nf(v,0);
const hz=v=>v==null||Math.abs(v)<0.005?'–':nf(v);
const pc=(v,d=0)=>v==null||!isFinite(v)?'–':(v*100).toFixed(d)+'%';
const sgn=v=>v==null||!isFinite(v)?'–':(v>0.004?'+':v<-0.004?'−':'')+nf(Math.abs(v));
const SEP='\u0001';
const CATS=['FA','CS','INT'];
const CATN={FA:'FA',CS:'CS',INT:'Internal'};
const DEF={company:'Finance Operations',dailyCap:8,defaultTarget:150,saturdayWork:false,lowPct:0.8,ncPct:0.25,belowTol:1,aboveTol:0.5,holidays:[],leaves:[],
 weekly:{enabled:true,day:1,time:'09:00',tz:(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone}catch(e){return 'UTC'}})(),range:'last',employees:true,managers:true,ams:true,hr:true,extra:true},
 monthly:{enabled:true,day:2}};

/* ================= state ================= */
const S={ver:0,cfg:{employees:[],clients:[],tasks:[],budgets:{byMonth:{},qc:{}},targets:{byMonth:{}},recips:[],settings:clone(DEF),history:{byMonth:{}}},ts:{},alloc:{},audit:{},cfgReady:false,init:false};
let HOL=new Set();
const st=()=>S.cfg.settings;
const F={month:monthOf(today()),date:'',emp:'',mgr:'',am:'',hr:'',client:'',cat:''};
let ME=null,VA=null,ID={admin:false,email:'',name:'',uid:null,platform:false};
let PAGE='',NAVOPEN=false;

function ingestCfg(m){
 const c=S.cfg;
 c.employees=(m.employees||{}).items||[];c.clients=(m.clients||{}).items||[];c.tasks=(m.tasks||{}).items||[];
 c.budgets=Object.assign({byMonth:{},qc:{}},m.budgets||{});c.targets=Object.assign({byMonth:{}},m.targets||{});
 c.recips=(m.recips||{}).items||[];c.history=Object.assign({byMonth:{}},m.history||{});
 c.settings=Object.assign(clone(DEF),m.settings||{});c.settings.weekly=Object.assign(clone(DEF.weekly),c.settings.weekly||{});
 HOL=new Set((c.settings.holidays||[]).map(h=>h.date));
 S.init=!!m.settings;S.cfgReady=true;S.ver++;
}
const empBy=id=>S.cfg.employees.find(e=>e.id===id);
const clientBy=code=>S.cfg.clients.find(c=>c.code===code);
const taskBy=n=>S.cfg.tasks.find(t=>t.name===n);
const eName=id=>{const e=empBy(id);return e?e.name:'(removed)'};
const eIni=id=>{const e=empBy(id);return e?e.ini:'?'};
const cName=code=>{const c=clientBy(code);return c?(c.internal?c.name:code+(c.name&&c.name!==code&&c.name!=='Client '+code?' · '+c.name:'')):code};
const targetOf=(id,m)=>{const t=((S.cfg.targets.byMonth||{})[m]||{})[id];if(t!=null)return +t;const e=empBy(id);return e&&e.target!=null?+e.target:st().defaultTarget};
const budgetOf=(code,m)=>{const b=((S.cfg.budgets.byMonth||{})[m]||{})[code];if(b!=null)return +b;const c=clientBy(code);return c?+c.budget||0:0};
function isWD(d){const w=dow(d);if(w===0)return false;if(w===6&&!st().saturdayWork)return false;return !HOL.has(d)}
function wdList(a,b){const o=[];for(let d=a;d<=b;d=addDays(d,1))if(isWD(d))o.push(d);return o}
const codeSort=(a,b)=>{const na=/^\d+$/.test(a),nb=/^\d+$/.test(b);if(na&&nb)return a-b;if(na)return -1;if(nb)return 1;return a<b?-1:a>b?1:0};

/* ================= storage (Claude platform db, Firebase, or localStorage) ================= */
const Store={db:null,mem:{},subs:[],mode:'local',
 async init(){
  if(window.claude&&typeof claude.use==='function'){try{this.db=await claude.use('db');if(this.db)this.mode='claude'}catch(e){this.db=null}}
  if(!this.db&&FIREBASE_CONFIG.apiKey){
   try{
    firebase.initializeApp(FIREBASE_CONFIG);this.db=firebase.firestore();this.mode='firebase';
    if(firebase.auth)try{await firebase.auth().signInAnonymously()}catch(e){toast('Firebase sign-in failed: '+((e&&e.message)||e),1)}
   }catch(e){this.db=null;this.mode='local';toast('Could not connect to Firebase: '+((e&&e.message)||e),1)}
  }
  if(!this.db){try{this.mem=JSON.parse(localStorage.getItem('tsp_local_v1')||'{}')}catch(e){this.mem={}}}
 },
 _save(){try{localStorage.setItem('tsp_local_v1',JSON.stringify(this.mem))}catch(e){}},
 _match(d,w){return w.every(x=>x[1]==='=='?d[x[0]]===x[2]:x[1]==='in'?x[2].indexOf(d[x[0]])>-1:true)},

function diffPair(b,a){if(!b||!a)return[b,a];const x={},y={};Object.keys(a).forEach(k=>{if(JSON.stringify(a[k])!==JSON.stringify(b[k])){x[k]=b[k];y[k]=a[k]}});return[x,y]}
function openForm(kind,id,only){
 const D=FS[kind],rec=id?D.get().find(x=>x.id===id):D.def();if(!rec)return;

 openModal('<h3>'+(id?'Edit ':'Add ')+D.ent+'</h3><form id="mf"><div class="fg">'+fields.map(f=>fld(f[0],f[1],f[2]||'text',rec[f[0]],{req:f[3],opts:Array.isArray(f[4])?f[4]:null,list:typeof f[4]==='string'?f[4]:'',ph:f[5],ro:!!(id&&D.ro&&D.ro.indexOf(f[0])>-1)})).join('')+'</div><datalist id="people">'+S.cfg.employees.map(e=>'<option value="'+esc(e.name)+'">').join('')+'</datalist><div class="err" id="merr"></div><div class="ft"><button type="button" class="btn" data-a="mclose">Cancel</button><button class="btn p">Save</button></div></form>',{wide:1,onSubmit:v=>saveMaster(kind,id,fields,v)});
}
async function saveMaster(kind,id,fields,v){
 const D=FS[kind],vals={},list=D.get();
 fields.forEach(f=>{let x=v[f[0]];const t=f[2]||'text';if(t==='bool')x=!!x;else if(t==='number')x=x===''||x==null?null:+x;else x=String(x==null?'':x).trim();if(t==='email'&&x)x=x.toLowerCase();if(f[3]&&(x===''||x==null))throw new Error(f[1]+' is required.');vals[f[0]]=x});
 (D.uniq||[]).forEach(k=>{if(vals[k]!==undefined&&vals[k]!==''&&list.some(x=>x.id!==id&&lc(x[k])===lc(vals[k])))throw new Error('Another '+D.ent+' already uses that '+(k==='ini'?'initial':k)+'.')});
 if(kind==='employees'&&vals.target==null)vals.target=st().defaultTarget;
 if(kind==='clients'&&vals.budget==null)vals.budget=0;
 let before=null,after=null;
 await setCfg(D.doc,d=>{d.items=d.items||[];if(id){const i=d.items.findIndex(x=>x.id===id);if(i<0)return false;before=Object.assign({},d.items[i]);d.items[i]=Object.assign({},d.items[i],vals);after=d.items[i]}
  else{const r=Object.assign(D.def(),vals);r.id=kind==='clients'?vals.code:uid();d.items.push(r);after=r}return d});
 try{const p=diffPair(before,after);await logAudit({action:id?'update':'create',entity:D.ent,ref:vals.name||vals.code||vals.email||'',before:p[0],after:p[1]})}catch(e){}
 toast(D.ent[0].toUpperCase()+D.ent.slice(1)+' saved');
}
function parseRows(text){
 return text.split(/\r?\n/).filter(l=>l.trim()).map(l=>{const sep=l.indexOf('\t')>-1?'\t':',',o=[];let cur='',q=false;for(let i=0;i<l.length;i++){const c=l[i];if(q){if(c==='"'&&l[i+1]==='"'){cur+='"';i++}else if(c==='"')q=false;else cur+=c}else if(c==='"')q=true;else if(c===sep){o.push(cur.trim());cur=''}else cur+=c}o.push(cur.trim());return o});
}
async function doImport(kind,text){
 let rows=parseRows(text);if(rows.length&&['name','code'].indexOf(lc(rows[0][0]))>-1)rows=rows.slice(1);if(!rows.length)throw new Error('No rows found.');
 let n=0;
 await setCfg(kind,d=>{d.items=d.items||[];rows.forEach(r=>{
  if(kind==='employees'){const email=lc(r[2]);if(!r[0]||!r[1]||!email)return;const rec={name:r[0],ini:r[1].toUpperCase(),email,target:r[3]!==''&&r[3]!=null?+r[3]:st().defaultTarget,mgrName:r[4]||'',mgrEmail:lc(r[5]),amName:r[6]||'',amEmail:lc(r[7]),hrName:r[8]||'',hrEmail:lc(r[9]),other:r[10]||''};
   const i=d.items.findIndex(x=>lc(x.email)===email);if(i>-1)d.items[i]=Object.assign({},d.items[i],rec);else d.items.push(Object.assign({id:uid(),role:'Employee',active:true},rec));n++}
  else{const code=(r[0]||'').trim();if(!code||!r[1])return;const rec={code,name:r[1],budget:+r[2]||0,owner:r[3]||'',email:lc(r[4])};const i=d.items.findIndex(x=>x.code===code);if(i>-1)d.items[i]=Object.assign({},d.items[i],rec);else d.items.push(Object.assign({id:code,active:true,internal:false},rec));n++}});return d});
 try{await logAudit({action:'import',entity:kind==='employees'?'employee':'client',ref:n+' rows imported'})}catch(e){}
 toast(n+' rows imported');
}

 const items=[];Object.keys(S.audit).forEach(k=>(S.audit[k].items||[]).forEach(i=>items.push(i)));items.sort((a,b)=>b.at.localeCompare(a.at));

 const chg=i=>{const f=v=>v==null?'':typeof v==='object'?Object.keys(v).map(k=>k+': '+v[k]).join(', '):String(v);return i.before||i.after?(i.before?'<div class="mut">'+esc(f(i.before))+'</div>':'')+(i.after?'<div>'+esc(f(i.after))+'</div>':''):'–'};
 return ph('Audit log','Every admin correction and master-data change · '+fM(F.month),'<label class="f" style="flex-direction:row;gap:6px;align-items:center">Month<input type="month" data-f="month" value="'+F.month+'"></label><input class="inl" style="width:200px" placeholder="Search log…" data-d="au.q" data-q value="'+esc(DR.au.q)+'"><button class="btn" data-a="au_csv">Download CSV</button>')+

}

 saveFile('audit-log-'+F.month+'.csv',csvText([['When','Actor','Action','Entity','Record','Before','After','Reason']].concat(items.map(i=>[i.at,i.actor,i.action,i.entity,i.ref,JSON.stringify(i.before||''),JSON.stringify(i.after||''),i.reason]))))};

 tbl([{h:'Employee',g:l=>esc(eName(l.emp))},{h:'Date',g:l=>fD(l.date)},{h:'Hours',n:1,g:l=>nf(l.hours)},{h:'',g:l=>'<button class="btn s d" data-a="lv_del" data-id="'+l.id+'">Remove</button>'}],lv,{max:300,empty:'No leave recorded.'})+'</div></div>'+
 '<div class="card" style="margin-top:14px"><h3>Backup &amp; restore</h3><div class="sub">Export everything (employees, clients, allocations, timesheets, settings, audit log) as one file you can keep safe or move to another deployment. Do this regularly, and always before making a big change.</div><div class="chips"><button class="btn p" data-a="export_all">Export all data (backup)</button><button class="btn" data-a="import_all">Import data from backup</button></div></div>'+
 '<div class="card" style="margin-top:14px"><h3>Demo / reset</h3><div class="sub">Demo data fills the current month with sample allocations and hours based on the layout of your Excel sheets.</div><div class="chips"><button class="btn" data-a="demo_reload">Replace everything with demo data</button><button class="btn d" data-a="wipe">Delete all data and start empty</button></div></div>';

/* ================= onboarding, render, events ================= */
const VIEW={company:dCompany,manager:dManager,team:dTeam,client:dClient,individual:dIndividual,allocation:pAllocation,timesheet:pTimesheet,alerts:pAlerts,reports:pReports,monthly:pMonthly,weekly:pWeekly,masters:pMasters,audit:pAudit,settings:pSettings};
function onboard(){
 const inner=ME.admin?'<h2>Set up the portal</h2><p class="mut">Nothing has been created yet. Load demo data to explore every screen with sample employees, clients, allocations and hours, or start empty and add your own masters.</p><div class="chips"><button class="btn p" data-a="ob_demo">Load demo data</button><button class="btn" data-a="ob_empty">Start with an empty portal</button></div>'
  :'<h2>Portal not set up yet</h2><p class="mut">An administrator needs to set up the portal before it can be used. Please check back soon.</p>';
 return'<div class="page" style="max-width:680px;margin:8vh auto 0"><div class="card">'+inner+'</div></div>';
}
function noAccess(){return'<div class="page" style="max-width:680px;margin:8vh auto 0"><div class="card"><h2>No access yet</h2><p class="mut">'+(ID.email?'Your account ('+esc(ID.email)+') is not linked to an employee record or a reporting role.':'Your account email is not available to the portal.')+' Ask an administrator to add your email in the Employee Master.</p></div></div>'}
function normalizeF(){if(!/^\d{4}-\d{2}$/.test(F.month))F.month=monthOf(today());if(F.date&&monthOf(F.date)!==F.month)F.date='';if(ME.pure){F.emp=ME.emp?ME.emp.id:'';F.mgr='';F.am='';F.hr=''}}

 const app=$('#app');if(!app||!S.cfgReady)return;
 ME=who();
 if(!S.init){app.innerHTML=onboard();return}
 if(!ME.admin&&ME.roles.size===0){app.innerHTML=noAccess();return}
 normalizeF();resubscribe();
 const pages=PAGES.filter(canSee);if(!pages.some(p=>p.id===PAGE))PAGE=defaultPage(pages);
 if(PAGE==='audit')subAudit();
 const C=build();let body;
 try{body=VIEW[PAGE](C)}catch(e){console.error(e);body='<div class="note r">This page could not be drawn: '+esc(e.message)+'</div>'}
 const ae=document.activeElement,key=ae&&ae.dataset?(ae.dataset.d?['data-d',ae.dataset.d]:ae.dataset.f?['data-f',ae.dataset.f]:null):null,ss=ae&&ae.selectionStart,y=window.scrollY;
 app.innerHTML=shell(C,body);
 if(key){const el=$('['+key[0]+'="'+key[1]+'"]');if(el){el.focus();try{if(ss!=null)el.setSelectionRange(ss,ss)}catch(e){}}}
 window.scrollTo(0,y);
}
function setF(k,v){if(k==='month'){if(!/^\d{4}-\d{2}$/.test(v))return;F.month=v;if(F.date&&monthOf(F.date)!==v)F.date=''}else if(k==='date'){F.date=v;if(v)F.month=monthOf(v)}else F[k]=v;render()}

 const btn=$('.btn.p',f);if(btn)btn.disabled=true;
 Promise.resolve().then(()=>MODAL.onSubmit(v)).then(r=>{if(r!==false)closeModal()}).catch(err=>{const el=$('#merr');if(el)el.textContent=(err&&err.message)||String(err)}).then(()=>{if(btn)btn.disabled=false})});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&MODAL&&!MODAL.blocking)closeModal(true);const t=e.target;if((e.key==='Enter'||e.key===' ')&&t&&t.matches&&t.matches('.nav a')){e.preventDefault();t.click()}});
function checkGate(){
 if(!SITE_PASSWORD)return Promise.resolve();
 try{if(localStorage.getItem('tsp_gate')===SITE_PASSWORD)return Promise.resolve()}catch(e){}
 return new Promise(res=>{
  const app=$('#app');
  app.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:16px"><div class="card" style="max-width:340px;width:100%"><h3>This portal is password protected</h3><p class="sub" style="margin:2px 0 12px">Ask your admin for the password.</p><form id="gf"><div class="fg"><label>Password<input type="password" id="gpw" autofocus></label></div><div class="err" id="gerr"></div><div class="ft" style="justify-content:flex-start"><button class="btn p">Unlock</button></div></form></div></div>';
  $('#gf').addEventListener('submit',e=>{e.preventDefault();const v=$('#gpw').value;
   if(v===SITE_PASSWORD){try{localStorage.setItem('tsp_gate',v)}catch(er){}res()}
   else{$('#gerr').textContent='Incorrect password.';$('#gpw').value='';$('#gpw').focus()}});
 });
}
async function boot(){
 try{const th=localStorage.getItem('tsp_theme');if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}
 await checkGate();
 await Store.init();await initIdentity();startCfg();render();
}
boot().catch(e=>{const a=$('#app');if(a)a.innerHTML='<div class="boot">The portal could not start: '+esc((e&&e.message)||e)+'</div>'});
window.__portal={S,F,build:()=>{ME=who();normalizeF();return build()},render,VIEW,ACT,setF,loadDemo,buildDemo,getAlerts,who,Store,setPage:p=>{PAGE=p}};
})();
